<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StayEase - Admin Reviews</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f9;
            color: #333;
        }

        header {
            background: #172554;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 30px auto;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 20px;
        }

        select {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            min-width: 200px;
        }

        .review-card {
            background: white;
            padding: 20px;
            margin-bottom: 18px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .review-card h3 {
            color: #172554;
            margin-bottom: 12px;
        }

        .review-card p {
            margin: 9px 0;
            line-height: 1.5;
        }

        .stars {
            color: #f59e0b;
            font-size: 20px;
            margin: 8px 0;
        }

        .location {
            color: #2563eb;
            font-weight: bold;
        }

        .date {
            color: #777;
            font-size: 13px;
        }

        .delete-btn {
            background: #dc2626;
            color: white;
            border: none;
            padding: 9px 16px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }

        .delete-btn:hover {
            background: #991b1b;
        }

        .back-btn {
            background: #2563eb;
            color: white;
            padding: 10px 15px;
            text-decoration: none;
            border-radius: 5px;
        }

        .empty {
            text-align: center;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        .count {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        @media(max-width: 600px) {
            .container {
                width: 94%;
            }

            .top-bar {
                align-items: stretch;
            }

            select {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>StayEase Admin Panel</h1>
    <p>Customer Reviews Management</p>
</header>

<div class="container">

    <div class="top-bar">
        <h2>All Customer Reviews</h2>

        <a href="/admin/dashboard" class="back-btn">
            Back to Dashboard
        </a>
    </div>

    <div class="top-bar">
        <label for="hotelFilter"><b>Filter by Hotel:</b></label>

        <select id="hotelFilter" onchange="displayReviews()">
            <option value="all">All Hotels</option>
        </select>
    </div>

    <div class="count" id="reviewCount"></div>

    <div id="reviewsContainer"></div>

</div>

<script>

    // Admin login check
    if (localStorage.getItem("adminLogin") !== "true") {
        window.location.href = "/admin/login";
    }

    // Default hotel locations
    const hotelLocations = {
        "Taj Grand Hotel": "Hyderabad",
        "City Comfort Inn": "Hyderabad",
        "Royal Hyderabad Stay": "Hyderabad",
        "Pearl Budget Hotel": "Hyderabad",
        "Grand Palace Hyderabad": "Hyderabad",

        "Royal Palace": "Bangalore",
        "Budget Stay Bangalore": "Bangalore",
        "Garden View Hotel": "Bangalore",
        "Bangalore Comfort Suites": "Bangalore",
        "Luxury Crown Hotel": "Bangalore",

        "Sea View Resort": "Goa",
        "Goa Beach Stay": "Goa",
        "Palm Tree Resort": "Goa",
        "Sunset Paradise": "Goa",
        "Ocean Luxury Resort": "Goa",

        "Mumbai Heights": "Mumbai",
        "City Budget Hotel": "Mumbai",
        "Marine Drive Hotel": "Mumbai",
        "Dream City Suites": "Mumbai",
        "Grand Mumbai Palace": "Mumbai",

        "Delhi Grand": "Delhi",
        "Delhi Comfort Stay": "Delhi",
        "Capital View Hotel": "Delhi",
        "Royal Delhi Suites": "Delhi",
        "Imperial Luxury Hotel": "Delhi"
    };

    function getReviews() {
        return JSON.parse(localStorage.getItem("hotelReviews")) || [];
    }

    function saveReviews(reviews) {
        localStorage.setItem("hotelReviews", JSON.stringify(reviews));
    }

    // Get location from hotel data or default list
    function getHotelLocation(hotelName) {

        const adminHotels =
            JSON.parse(localStorage.getItem("adminHotels")) || [];

        const allAdminHotels = Array.isArray(adminHotels)
            ? adminHotels
            : Object.values(adminHotels);

        const hotel = allAdminHotels.find(h =>
            (h.name || h.hotelName || "").toLowerCase() ===
            (hotelName || "").toLowerCase()
        );

        if (hotel) {
            return hotel.city || hotel.location ||
                   hotel.subLocation || "Location not available";
        }

        return hotelLocations[hotelName] || "Location not available";
    }

    // Create hotel filter options
    function loadHotelFilter() {

        const reviews = getReviews();
        const hotels = [...new Set(
            reviews.map(r => r.hotelName).filter(Boolean)
        )];

        const filter = document.getElementById("hotelFilter");

        filter.innerHTML = '<option value="all">All Hotels</option>';

        hotels.forEach(hotel => {
            const option = document.createElement("option");
            option.value = hotel;
            option.textContent = hotel;
            filter.appendChild(option);
        });
    }

    // Display reviews
    function displayReviews() {

        const reviews = getReviews();
        const selectedHotel =
            document.getElementById("hotelFilter").value;

        const container =
            document.getElementById("reviewsContainer");

        const filteredReviews = reviews
            .map((review, index) => ({ review, index }))
            .filter(item =>
                selectedHotel === "all" ||
                item.review.hotelName === selectedHotel
            );

        document.getElementById("reviewCount").innerHTML =
            "<b>Total Reviews:</b> " + filteredReviews.length;

        if (filteredReviews.length === 0) {
            container.innerHTML =
                '<div class="empty">No reviews available.</div>';
            return;
        }

        container.innerHTML = filteredReviews.map(item => {

            const r = item.review;
            const location = getHotelLocation(r.hotelName);

            const customerName =
                r.customerName || r.name || "Customer";

            const rating = Number(r.rating) || 0;

            const stars =
                "★".repeat(Math.max(0, Math.min(5, rating))) +
                "☆".repeat(5 - Math.max(0, Math.min(5, rating)));

            const reviewDate =
                r.date || r.reviewDate ||
                r.createdAt || "Date not available";

            return `
                <div class="review-card">

                    <h3>${escapeHTML(customerName)}</h3>

                    <p>
                        <b>Hotel:</b>
                        ${escapeHTML(r.hotelName || "Unknown Hotel")}
                    </p>

                    <p class="location">
                        📍 Location: ${escapeHTML(location)}
                    </p>

                    <div class="stars">${stars}</div>

                    <p>
                        ${escapeHTML(r.comment || r.review || "")}
                    </p>

                    <p class="date">
                        Review Date: ${escapeHTML(formatDate(reviewDate))}
                    </p>

                    <button class="delete-btn"
                        onclick="deleteReview(${item.index})">
                        Delete Review
                    </button>

                </div>
            `;

        }).join("");
    }

    // Delete review
    function deleteReview(index) {

        if (!confirm("Are you sure you want to delete this review?")) {
            return;
        }

        const reviews = getReviews();

        reviews.splice(index, 1);

        saveReviews(reviews);

        loadHotelFilter();
        displayReviews();

        alert("Review deleted successfully!");
    }

    // Format date
    function formatDate(value) {

        if (!value) return "Date not available";

        const date = new Date(value);

        if (isNaN(date.getTime())) return value;

        return date.toLocaleDateString("en-GB");
    }

    // Prevent HTML injection in review text
    function escapeHTML(value) {
        return String(value).replace(/[&<>"']/g, char => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        })[char]);
    }

    loadHotelFilter();
    displayReviews();

</script>

</body>
</html>

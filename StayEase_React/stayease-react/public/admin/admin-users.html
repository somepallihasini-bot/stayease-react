<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Users - StayEase</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f9;
            color: #333;
        }

        header {
            background: #173b57;
            color: white;
            padding: 18px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        header h2 {
            font-size: 24px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 15px;
        }

        nav a:hover {
            color: #ffd166;
        }

        .container {
            width: 92%;
            max-width: 1100px;
            margin: 35px auto;
        }

        h1 {
            color: #173b57;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 25px;
        }

        .stats {
            background: white;
            padding: 22px;
            border-radius: 8px;
            box-shadow: 0 2px 8px #ddd;
            margin-bottom: 25px;
        }

        .stats p {
            color: #777;
            margin-bottom: 8px;
        }

        .stats h2 {
            color: #173b57;
            font-size: 28px;
        }

        .table-container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            overflow-x: auto;
            box-shadow: 0 2px 8px #ddd;
        }

        table {
            width: 100%;
            min-width: 650px;
            border-collapse: collapse;
        }

        th, td {
            padding: 14px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #173b57;
            color: white;
        }

        tr:hover {
            background: #f5f8fa;
        }

        .delete-btn {
            background: #c0392b;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
        }

        .delete-btn:hover {
            background: #a93226;
        }

        .empty {
            text-align: center;
            padding: 25px;
            color: #777;
            display: none;
        }

        .refresh-btn {
            background: #173b57;
            color: white;
            border: none;
            padding: 10px 17px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
        }

        footer {
            background: #173b57;
            color: white;
            text-align: center;
            padding: 18px;
            margin-top: 40px;
        }

        @media(max-width: 600px) {
            header {
                flex-direction: column;
            }

            nav a {
                display: inline-block;
                margin: 7px;
            }
        }

        @media print {
            header, footer, .refresh-btn, .delete-btn {
                display: none;
            }
        }
    </style>
</head>

<body>

<header>
    <h2>StayEase Admin</h2>

    <nav>
        <a href="/admin/dashboard">Dashboard</a>
        <a href="admin-hotels.html">Hotels</a>
        <a href="admin-bookings.html">Bookings</a>
        <a href="admin-reviews.html">Reviews</a>
    </nav>
</header>

<div class="container">

    <h1>Manage Users</h1>
    <p class="subtitle">View and manage registered customers.</p>

    <div class="stats">
        <p>Total Registered Users</p>
        <h2 id="totalUsers">0</h2>
    </div>

    <div class="table-container">

        <table>
            <thead>
                <tr>
                    <th>S.No</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="userTable"></tbody>
        </table>

        <div id="emptyMessage" class="empty">
            No registered users found.
        </div>

    </div>

    <button class="refresh-btn" onclick="loadUsers()">
        Refresh Users
    </button>

    <button class="refresh-btn" onclick="window.print()">
        Print Users
    </button>

</div>

<footer>
    <p>© 2026 StayEase - Admin Dashboard</p>
</footer>

<script>

    // Admin login check
    if (localStorage.getItem("adminLogin") !== "true") {
        alert("Please login as Admin");
        window.location.href = "/admin/login";
    }

    function escapeHTML(value) {
        return String(value ?? "").replace(/[&<>"']/g, function(char) {
            return {
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;"
            }[char];
        });
    }

    function loadUsers() {

        let users = JSON.parse(
            localStorage.getItem("users")
        ) || [];

        let table = document.getElementById("userTable");
        let emptyMessage = document.getElementById("emptyMessage");

        table.innerHTML = "";

        document.getElementById("totalUsers").textContent =
            users.length;

        if (users.length === 0) {
            emptyMessage.style.display = "block";
            return;
        }

        emptyMessage.style.display = "none";

        users.forEach(function(user, index) {

            let row = document.createElement("tr");

            row.innerHTML = `
                <td>${index + 1}</td>

                <td>${escapeHTML(user.name || user.userName || "N/A")}</td>

                <td>${escapeHTML(user.email || user.userEmail || "N/A")}</td>

                <td>
                    <button class="delete-btn"
                        onclick="deleteUser(${index})">
                        Delete
                    </button>
                </td>
            `;

            table.appendChild(row);
        });
    }

    function deleteUser(index) {

        let users = JSON.parse(
            localStorage.getItem("users")
        ) || [];

        if (!confirm("Are you sure you want to delete this user?")) {
            return;
        }

        users.splice(index, 1);

        localStorage.setItem("users", JSON.stringify(users));

        alert("User deleted successfully!");

        loadUsers();
    }

    loadUsers();

</script>

</body>
</html>

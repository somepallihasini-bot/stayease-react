<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StayEase - Manage Hotels</title>

    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: Arial, sans-serif; background: #f4f6f9; }
        header { background: #123456; color: white; padding: 18px 5%; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
        header a { color: white; text-decoration: none; }
        .container { max-width: 1100px; margin: auto; padding: 20px; }
        .form-box, .hotel-card { background: white; padding: 20px; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 3px 10px #ddd; }
        h2 { color: #123456; }
        input, select { width: 100%; padding: 11px; margin: 7px 0 14px; border: 1px solid #ccc; border-radius: 5px; }
        button { padding: 10px 15px; border: 0; border-radius: 5px; color: white; background: #123456; cursor: pointer; margin: 4px; }
        .delete { background: #c0392b; }
        .edit { background: #218c74; }
        .hotel-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 18px; }
        .hotel-card img { width: 100%; height: 150px; object-fit: cover; border-radius: 7px; }
        .hotel-card h3 { color: #123456; }
        .message { color: green; font-weight: bold; }
    </style>
</head>
<body>

<header>
    <h2 style="color:white; margin:0;">StayEase Admin</h2>
    <a href="/admin/dashboard">Back to Dashboard</a>
</header>

<div class="container">

    <h2>Manage Hotels</h2>

    <div class="form-box">
        <h3 id="formTitle">Add New Hotel</h3>

        <form id="hotelForm">
            <input type="hidden" id="hotelId">

            <label>Hotel Name</label>
            <input type="text" id="name" placeholder="Hotel Name" required>

            <label>City</label>
            <select id="location" required>
                <option value="">Select City</option>
                <option>Hyderabad</option>
                <option>Bangalore</option>
                <option>Goa</option>
                <option>Mumbai</option>
                <option>Delhi</option>
            </select>

            <label>Sub Location</label>
            <input type="text" id="subLocation" placeholder="Area / Sub Location" required>

            <label>Price per Night (₹)</label>
            <input type="number" id="price" min="1" placeholder="Enter Price" required>

            <label>Rating</label>
            <input type="number" id="rating" min="1" max="5" step="0.1" placeholder="Rating (1 to 5)" required>

            <label>Hotel Image URL</label>
            <input type="url" id="image" placeholder="Paste image URL" required>

            <button type="submit">Save Hotel</button>
            <button type="button" onclick="resetForm()">Clear Form</button>
        </form>

        <p id="message" class="message"></p>
    </div>

    <h2>All Hotels</h2>
    <h3 id="hotelCount"></h3>

    <div class="hotel-grid" id="hotelList"></div>

</div>

<script>
    // Admin login protection
    if (localStorage.getItem("adminLogin") !== "true") {
        window.location.href = "/admin/login";
    }

    // Initial 25 hotels
    const defaultHotels = [
        // Hyderabad
        {id:1,name:"Taj Grand Hotel",location:"Hyderabad",subLocation:"Banjara Hills",price:4500,rating:4.8,image:"https://images.unsplash.com/photo-1566073771259-6a8506099945"},
        {id:2,name:"City Comfort Hotel",location:"Hyderabad",subLocation:"Gachibowli",price:3500,rating:4.5,image:"https://images.unsplash.com/photo-1542314831-068cd1dbfeeb"},
        {id:3,name:"Royal Orchid",location:"Hyderabad",subLocation:"Hitech City",price:5000,rating:4.7,image:"https://images.unsplash.com/photo-1571896349842-33c89424de2d"},
        {id:4,name:"Green Park Hotel",location:"Hyderabad",subLocation:"Madhapur",price:4000,rating:4.6,image:"https://images.unsplash.com/photo-1564501049412-61c2a3083791"},
        {id:5,name:"Grand Palace",location:"Hyderabad",subLocation:"Secunderabad",price:3000,rating:4.3,image:"https://images.unsplash.com/photo-1582719508461-905c673771fd"},

        // Bangalore
        {id:6,name:"Royal Palace",location:"Bangalore",subLocation:"MG Road",price:3500,rating:4.5,image:"https://images.unsplash.com/photo-1542314831-068cd1dbfeeb"},
        {id:7,name:"Garden View Hotel",location:"Bangalore",subLocation:"Whitefield",price:4200,rating:4.6,image:"https://images.unsplash.com/photo-1566073771259-6a8506099945"},
        {id:8,name:"Urban Stay",location:"Bangalore",subLocation:"Koramangala",price:2800,rating:4.2,image:"https://images.unsplash.com/photo-1571896349842-33c89424de2d"},
        {id:9,name:"Elite Residency",location:"Bangalore",subLocation:"Indiranagar",price:5000,rating:4.8,image:"https://images.unsplash.com/photo-1564501049412-61c2a3083791"},
        {id:10,name:"Tech Park Hotel",location:"Bangalore",subLocation:"Electronic City",price:3200,rating:4.4,image:"https://images.unsplash.com/photo-1582719508461-905c673771fd"},

        // Goa
        {id:11,name:"Sea View Resort",location:"Goa",subLocation:"Calangute",price:6000,rating:4.7,image:"https://images.unsplash.com/photo-1571896349842-33c89424de2d"},
        {id:12,name:"Beach Paradise",location:"Goa",subLocation:"Baga Beach",price:5500,rating:4.8,image:"https://images.unsplash.com/photo-1566073771259-6a8506099945"},
        {id:13,name:"Palm Resort",location:"Goa",subLocation:"Candolim",price:4500,rating:4.5,image:"https://images.unsplash.com/photo-1542314831-068cd1dbfeeb"},
        {id:14,name:"Sunset Stay",location:"Goa",subLocation:"Anjuna",price:3800,rating:4.4,image:"https://images.unsplash.com/photo-1564501049412-61c2a3083791"},
        {id:15,name:"Ocean Blue Hotel",location:"Goa",subLocation:"Panjim",price:4000,rating:4.6,image:"https://images.unsplash.com/photo-1582719508461-905c673771fd"},

        // Mumbai
        {id:16,name:"Mumbai Heights",location:"Mumbai",subLocation:"Andheri",price:5000,rating:4.6,image:"https://images.unsplash.com/photo-1564501049412-61c2a3083791"},
        {id:17,name:"Bandra Grand",location:"Mumbai",subLocation:"Bandra",price:6500,rating:4.8,image:"https://images.unsplash.com/photo-1566073771259-6a8506099945"},
        {id:18,name:"Sea Breeze Hotel",location:"Mumbai",subLocation:"Juhu",price:5500,rating:4.7,image:"https://images.unsplash.com/photo-1571896349842-33c89424de2d"},
        {id:19,name:"Royal Marine Hotel",location:"Mumbai",subLocation:"Colaba",price:7000,rating:4.9,image:"https://images.unsplash.com/photo-1542314831-068cd1dbfeeb"},
        {id:20,name:"Lake View Residency",location:"Mumbai",subLocation:"Powai",price:4200,rating:4.5,image:"https://images.unsplash.com/photo-1582719508461-905c673771fd"},

        // Delhi
        {id:21,name:"Delhi Grand",location:"Delhi",subLocation:"Connaught Place",price:4000,rating:4.4,image:"https://images.unsplash.com/photo-1582719508461-905c673771fd"},
        {id:22,name:"Capital Residency",location:"Delhi",subLocation:"Karol Bagh",price:3000,rating:4.3,image:"https://images.unsplash.com/photo-1542314831-068cd1dbfeeb"},
        {id:23,name:"Airport Luxury Hotel",location:"Delhi",subLocation:"Aerocity",price:6500,rating:4.9,image:"https://images.unsplash.com/photo-1566073771259-6a8506099945"},
        {id:24,name:"Dwarka Comfort Inn",location:"Delhi",subLocation:"Dwarka",price:2800,rating:4.2,image:"https://images.unsplash.com/photo-1564501049412-61c2a3083791"},
        {id:25,name:"Saket Royal Hotel",location:"Delhi",subLocation:"Saket",price:4500,rating:4.6,image:"https://images.unsplash.com/photo-1571896349842-33c89424de2d"}
    ];

    // Load existing hotels or initialize with 25 hotels
    let hotels = JSON.parse(localStorage.getItem("adminHotels"));

    if (!hotels || hotels.length === 0) {
        hotels = defaultHotels;
        saveHotels();
    }

    function saveHotels() {
        localStorage.setItem("adminHotels", JSON.stringify(hotels));
    }

    function displayHotels() {
        let list = document.getElementById("hotelList");
        list.innerHTML = "";

        document.getElementById("hotelCount").innerText =
            "Total Hotels: " + hotels.length;

        hotels.forEach(hotel => {
            list.innerHTML += `
                <div class="hotel-card">
                    <img src="${hotel.image}" alt="${hotel.name}">
                    <h3>${hotel.name}</h3>
                    <p>City: ${hotel.location}</p>
                    <p>Area: ${hotel.subLocation}</p>
                    <p>Price: ₹${hotel.price} / night</p>
                    <p>Rating: ⭐ ${hotel.rating}</p>
                    <button class="edit" onclick="editHotel(${hotel.id})">Edit</button>
                    <button class="delete" onclick="deleteHotel(${hotel.id})">Delete</button>
                </div>
            `;
        });
    }

    document.getElementById("hotelForm").addEventListener("submit", function(event) {
        event.preventDefault();

        let id = document.getElementById("hotelId").value;

        let hotelData = {
            id: id ? Number(id) : Date.now(),
            name: document.getElementById("name").value.trim(),
            location: document.getElementById("location").value,
            subLocation: document.getElementById("subLocation").value.trim(),
            price: Number(document.getElementById("price").value),
            rating: Number(document.getElementById("rating").value),
            image: document.getElementById("image").value.trim()
        };

        if (hotelData.rating < 1 || hotelData.rating > 5 ||
            hotelData.price <= 0) {
            alert("Enter a valid price and rating between 1 and 5.");
            return;
        }

        if (id) {
            hotels = hotels.map(hotel =>
                Number(hotel.id) === Number(id) ? hotelData : hotel
            );
            document.getElementById("message").innerText = "Hotel updated successfully!";
        } else {
            hotels.push(hotelData);
            document.getElementById("message").innerText = "Hotel added successfully!";
        }

        saveHotels();
        resetForm();
        displayHotels();
    });

    function editHotel(id) {
        let hotel = hotels.find(item => Number(item.id) === Number(id));
        if (!hotel) return;

        document.getElementById("hotelId").value = hotel.id;
        document.getElementById("name").value = hotel.name;
        document.getElementById("location").value = hotel.location;
        document.getElementById("subLocation").value = hotel.subLocation;
        document.getElementById("price").value = hotel.price;
        document.getElementById("rating").value = hotel.rating;
        document.getElementById("image").value = hotel.image;

        document.getElementById("formTitle").innerText = "Edit Hotel";
        window.scrollTo({top: 0, behavior: "smooth"});
    }

    function deleteHotel(id) {
        if (confirm("Are you sure you want to delete this hotel?")) {
            hotels = hotels.filter(hotel => Number(hotel.id) !== Number(id));
            saveHotels();
            displayHotels();
        }
    }

    function resetForm() {
        document.getElementById("hotelForm").reset();
        document.getElementById("hotelId").value = "";
        document.getElementById("formTitle").innerText = "Add New Hotel";
        document.getElementById("message").innerText = "";
    }

    displayHotels();
</script>

</body>
</html>

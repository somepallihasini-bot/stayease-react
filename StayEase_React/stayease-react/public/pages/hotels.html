<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Explore Hotels - StayEase</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f9;
    color: #333;
}

header {
    background: #173b67;
    color: white;
    padding: 18px 5%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
}

header h1 { margin: 0; }

nav {
    display: flex;
    flex-wrap: wrap;
    gap: 15px;
}

nav a {
    color: white;
    text-decoration: none;
    font-weight: bold;
}

.hero {
    text-align: center;
    padding: 35px 15px;
    background: #dcecff;
}

.hero h2 {
    color: #173b67;
    font-size: 30px;
}

.container {
    max-width: 1200px;
    margin: auto;
    padding: 20px;
}

.filters {
    background: white;
    padding: 20px;
    border-radius: 10px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 15px;
    margin-bottom: 25px;
}

input, select {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 6px;
}

.hotel-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 22px;
}

.hotel-card {
    background: white;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 3px 12px #ddd;
    transition: 0.2s;
}

.hotel-card:hover {
    transform: translateY(-4px);
}

.hotel-card img {
    width: 100%;
    height: 190px;
    object-fit: cover;
}

.hotel-info { padding: 16px; }

.hotel-info h3 {
    color: #173b67;
    margin-top: 0;
}

.hotel-info p { margin: 9px 0; }

.price {
    color: #14823b;
    font-size: 20px;
    font-weight: bold;
}

.hotel-actions {
    display: flex;
    gap: 10px;
    margin-top: 12px;
}

.hotel-actions button {
    width: 50%;
    color: white;
    border: none;
    padding: 12px 5px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
}

.details-btn { background: #173b67; }
.wishlist-btn { background: #e84363; }

.no-results {
    text-align: center;
    padding: 30px;
    font-size: 18px;
    display: none;
}

footer {
    background: #173b67;
    color: white;
    text-align: center;
    padding: 18px;
    margin-top: 35px;
}
</style>
</head>

<body>

<header>
    <h1>StayEase 🏨</h1>
    <nav>
        <a href="/">Home</a>
        <a href="hotels.html">Hotels</a>
        <a href="my-bookings.html">My Bookings</a>
        <a href="/wishlist">Wishlist ❤️</a>
        <a href="profile.html">Profile</a>
        <a href="/login">Login</a>
    </nav>
</header>

<section class="hero">
    <h2>Explore Hotels</h2>
    <p>Find your perfect stay with StayEase!</p>
</section>

<div class="container">

    <div class="filters">

        <input type="text" id="searchInput"
        placeholder="Search hotel or location..."
        oninput="filterHotels()">

        <select id="cityFilter" onchange="filterHotels()">
            <option value="All">All Destinations</option>
            <option value="Hyderabad">Hyderabad</option>
            <option value="Bangalore">Bangalore</option>
            <option value="Goa">Goa</option>
            <option value="Mumbai">Mumbai</option>
            <option value="Delhi">Delhi</option>
        </select>

        <select id="priceFilter" onchange="filterHotels()">
            <option value="All">All Prices</option>
            <option value="3000">Below ₹3,000</option>
            <option value="5000">Below ₹5,000</option>
            <option value="7000">Below ₹7,000</option>
        </select>

        <select id="ratingFilter" onchange="filterHotels()">
            <option value="All">All Ratings</option>
            <option value="4.5">4.5 and Above</option>
            <option value="4">4.0 and Above</option>
            <option value="3">3.0 and Above</option>
        </select>

    </div>

    <h2>Available Hotels</h2>
    <p id="hotelCount"></p>

    <div class="hotel-grid" id="hotelContainer"></div>

    <div class="no-results" id="noResults">
        No hotels found. Try another search.
    </div>

</div>

<footer>
    <p>© 2026 StayEase - Smart Hotel Booking Platform</p>
</footer>

// ADMIN HOTELS

let adminHotels = [];

try {
    adminHotels = JSON.parse(
        localStorage.getItem("adminHotels") || "[]"
    );
} catch (error) {
    adminHotels = [];
}

let allHotels = [...defaultHotels];

adminHotels.forEach(hotel => {
    allHotels.push({
        name: hotel.name || hotel.hotelName || "New Hotel",
        city: hotel.city || hotel.location || "Other",
        area: hotel.area || hotel.subLocation || "",
        price: Number(hotel.price || hotel.hotelPrice || 0),
        rating: Number(hotel.rating || 4),
        image: hotel.image || hotel.hotelImage ||
            defaultHotels[0].image
    });
});

// ADD TO WISHLIST

function addToWishlist(hotel) {

    let wishlist = [];

    try {
        wishlist = JSON.parse(
            localStorage.getItem("wishlist") || "[]"
        );
    } catch (error) {
        wishlist = [];
    }

    let exists = wishlist.some(item =>
        item.name === hotel.name &&
        item.city === hotel.city
    );

    if (exists) {
        alert("Hotel already exists in Wishlist ❤️");
        return;
    }

    wishlist.push(hotel);

    localStorage.setItem(
        "wishlist",
        JSON.stringify(wishlist)
    );

    alert("Hotel Added to Wishlist Successfully ❤️");
}

// VIEW HOTEL DETAILS

function selectHotel(hotel) {

    localStorage.setItem("hotelName", hotel.name);
    localStorage.setItem("hotelPrice", hotel.price);
    localStorage.setItem("hotelLocation", hotel.city);
    localStorage.setItem("hotelSubLocation", hotel.area);
    localStorage.setItem("hotelImage", hotel.image);

    localStorage.removeItem("roomPrice");
    localStorage.removeItem("roomType");
    localStorage.removeItem("selectedRoomImage");

    window.location.href = "hotel-details.html";
}

// DISPLAY HOTELS

function displayHotels(hotels) {

    const container = document.getElementById("hotelContainer");
    const noResults = document.getElementById("noResults");

    container.innerHTML = "";

    document.getElementById("hotelCount").innerText =
        hotels.length + " hotels found";

    if (hotels.length === 0) {
        noResults.style.display = "block";
        return;
    }

    noResults.style.display = "none";

    hotels.forEach(hotel => {

        const card = document.createElement("div");
        card.className = "hotel-card";

        const image = document.createElement("img");
        image.src = hotel.image;
        image.alt = hotel.name;

        image.onerror = function() {
            this.onerror = null;
            this.src = defaultHotels[0].image;
        };

        const info = document.createElement("div");
        info.className = "hotel-info";

        const title = document.createElement("h3");
        title.textContent = hotel.name;

        const location = document.createElement("p");
        location.textContent = "📍 " + hotel.city + " - " + hotel.area;

        const rating = document.createElement("p");
        rating.textContent = "⭐ " + hotel.rating + " / 5";

        const price = document.createElement("p");
        price.className = "price";
        price.textContent =
            "₹" + hotel.price.toLocaleString("en-IN") + " / night";

        const actions = document.createElement("div");
        actions.className = "hotel-actions";

        const detailsButton = document.createElement("button");
        detailsButton.className = "details-btn";
        detailsButton.textContent = "View Details";
        detailsButton.onclick = function() {
            selectHotel(hotel);
        };

        const wishlistButton = document.createElement("button");
        wishlistButton.className = "wishlist-btn";
        wishlistButton.textContent = "❤️ Add to Wishlist";
        wishlistButton.onclick = function() {
            addToWishlist(hotel);
        };

        actions.appendChild(detailsButton);
        actions.appendChild(wishlistButton);

        info.appendChild(title);
        info.appendChild(location);
        info.appendChild(rating);
        info.appendChild(price);
        info.appendChild(actions);

        card.appendChild(image);
        card.appendChild(info);

        container.appendChild(card);
    });
}

// SEARCH AND FILTER

function filterHotels() {

    const search = document.getElementById("searchInput")
        .value.trim().toLowerCase();

    const city = document.getElementById("cityFilter").value;
    const price = document.getElementById("priceFilter").value;
    const rating = document.getElementById("ratingFilter").value;

    const filteredHotels = allHotels.filter(hotel => {

        const matchesSearch =
            hotel.name.toLowerCase().includes(search) ||
            hotel.city.toLowerCase().includes(search) ||
            hotel.area.toLowerCase().includes(search);

        const matchesCity =
            city === "All" ||
            hotel.city.toLowerCase() === city.toLowerCase();

        const matchesPrice =
            price === "All" ||
            hotel.price < Number(price);

        const matchesRating =
            rating === "All" ||
            hotel.rating >= Number(rating);

        return matchesSearch && matchesCity &&
               matchesPrice && matchesRating;
    });

    displayHotels(filteredHotels);
}

// HOME PAGE DESTINATION CONNECTION

function applyHomeSearch() {

    const params = new URLSearchParams(window.location.search);

    const urlCity = params.get("destination");

    const savedCity = localStorage.getItem("selectedDestination");

    const destination = urlCity || savedCity || "";

    if (destination) {

        const cityFilter = document.getElementById("cityFilter");
        const searchInput = document.getElementById("searchInput");

        const matchedCity = [
            "Hyderabad",
            "Bangalore",
            "Goa",
            "Mumbai",
            "Delhi"
        ].find(city =>
            city.toLowerCase() === destination.trim().toLowerCase()
        );

        if (matchedCity) {
            cityFilter.value = matchedCity;
            searchInput.value = "";
        } else {
            cityFilter.value = "All";
            searchInput.value = destination;
        }

        // Clear saved destination after applying it
        localStorage.removeItem("selectedDestination");

    }

    filterHotels();
}

// INITIAL DISPLAY

applyHomeSearch();

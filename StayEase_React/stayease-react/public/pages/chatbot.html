<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StayEase - Chatbot</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f1f5f9;
        }

        header {
            background: #142d4e;
            color: white;
            padding: 20px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h2 {
            color: #ffcc66;
        }

        header a {
            color: white;
            text-decoration: none;
        }

        .container {
            max-width: 750px;
            margin: 30px auto;
            padding: 15px;
        }

        .chat-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 3px 12px #ccc;
        }

        .chat-header {
            background: #2563eb;
            color: white;
            padding: 20px;
        }

        .chat-header p {
            margin-top: 7px;
            font-size: 14px;
        }

        #chatMessages {
            height: 400px;
            overflow-y: auto;
            padding: 20px;
            background: #f8fafc;
        }

        .message {
            padding: 12px 15px;
            margin: 12px 0;
            border-radius: 10px;
            max-width: 85%;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .bot {
            background: #e2e8f0;
            color: #222;
            margin-right: auto;
        }

        .user {
            background: #2563eb;
            color: white;
            margin-left: auto;
        }

        .input-area {
            display: flex;
            gap: 10px;
            padding: 15px;
            border-top: 1px solid #ddd;
        }

        input {
            flex: 1;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 7px;
            outline: none;
        }

        button {
            padding: 12px 18px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
        }

        button:hover {
            background: #1748b5;
        }

        .quick-questions {
            padding: 15px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .quick-questions button {
            background: #e0ecff;
            color: #1748b5;
            border: 1px solid #bfdbfe;
            font-size: 12px;
        }

        .quick-questions button:hover {
            background: #bfdbfe;
        }

        @media(max-width: 500px) {
            #chatMessages {
                height: 350px;
            }

            .input-area {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<header>
    <h2>StayEase</h2>
    <a href="/">Home</a>
</header>

<div class="container">

    <div class="chat-card">

        <div class="chat-header">
            <h2>🤖 StayEase Assistant</h2>
            <p>Online – How can I help you?</p>
        </div>

        <div id="chatMessages">
            <div class="message bot">
                Hello! Welcome to StayEase. 😊
                <br>
                How can I help you today?
            </div>
        </div>

        <div class="quick-questions">
            <button onclick="quickAsk('How can I book a hotel?')">
                Book a Hotel
            </button>

            <button onclick="quickAsk('How can I cancel my booking?')">
                Cancel Booking
            </button>

            <button onclick="quickAsk('What payment methods are available?')">
                Payment
            </button>

            <button onclick="quickAsk('Show hotel prices')">
                Hotel Prices
            </button>

            <button onclick="quickAsk('Where can I see my bookings?')">
                My Bookings
            </button>
        </div>

        <div class="input-area">
            <input
                type="text"
                id="userInput"
                placeholder="Type your question..."
                onkeydown="if(event.key === 'Enter') sendMessage()"
            >

            <button onclick="sendMessage()">Send</button>
        </div>

    </div>

</div>

<script>

    function addMessage(message, sender) {

        const chat = document.getElementById("chatMessages");

        const div = document.createElement("div");

        div.className = "message " + sender;

        // Display text safely
        div.textContent = message;

        chat.appendChild(div);

        chat.scrollTop = chat.scrollHeight;
    }

    function getBotReply(question) {

        const text = question.toLowerCase();

        if (text.includes("hello") || text.includes("hi")) {
            return "Hello! Welcome to StayEase. How can I help you?";
        }

        if (text.includes("book")) {
            return "To book a hotel, open Hotels page, select your hotel, choose a room and dates, then continue to payment.";
        }

        if (text.includes("cancel")) {
            return "Open My Bookings page, find your booking and use the Cancel Booking option if available.";
        }

        if (text.includes("payment") || text.includes("pay")) {
            return "StayEase demo supports Credit/Debit Card, UPI and Net Banking payment options.";
        }

        if (text.includes("price") || text.includes("cost")) {
            return "Hotel prices depend on the hotel and room type. Open the Hotels page to view available prices.";
        }

        if (text.includes("booking") || text.includes("reservation")) {
            return "You can view your reservations in the My Bookings page.";
        }

        if (text.includes("room")) {
            return "StayEase offers Standard, Deluxe, Executive and Suite room types. Available rooms depend on your selected dates.";
        }

        if (text.includes("location") || text.includes("map")) {
            return "Open a hotel's location page to view its map and directions.";
        }

        if (text.includes("coupon") || text.includes("discount")) {
            return "Try these demo coupons: SAVE10 for 10%, WELCOME20 for 20%, and STAYEASE15 for 15% discount.";
        }

        if (text.includes("thank")) {
            return "You're welcome! Thank you for choosing StayEase. 😊";
        }

        if (text.includes("contact") || text.includes("help")) {
            return "I can help with hotel booking, room details, payment, coupons and cancellations. For other issues, contact the StayEase support team.";
        }

        return "Sorry, I don't have an answer for that yet. Please ask about hotel booking, rooms, prices, payment, coupons or cancellation.";
    }

    function sendMessage() {

        const input = document.getElementById("userInput");

        const question = input.value.trim();

        if (question === "") {
            return;
        }

        addMessage(question, "user");

        input.value = "";

        const reply = getBotReply(question);

        setTimeout(function() {
            addMessage(reply, "bot");
        }, 400);
    }

    function quickAsk(question) {

        document.getElementById("userInput").value = question;

        sendMessage();
    }

</script>

</body>
</html>
